name: YAML Practice

on: push

jobs:
  yaml-practice:
    runs-on: ubuntu-latest

    steps:
      - name: Show scalar
        run: echo "Name: prathyusha"

      - name: Show location
        run: echo "Location: Bangalore"

      - name: Show profession
        run: echo "Profession: no job"

      - name: Show hobbies
        run: |
          echo "Hobbies:"
          echo "- Reading"
          echo "- Writing"
          echo "- Practice"

      - name: Show favorite colours
        run: |
          echo "Favorite colours:"
          echo "Blue"
          echo "Green"
          echo "Red"

      - name: Show games
        run: |
          echo "Playing games:"
          echo "Hockey"
          echo "Ball"

      - name: Multiline scalar
        run: |
          echo "I am learning scalars."
          echo "I am learning lists."
          echo "I am learning mappings."
          echo "I am learning multiline scalars."
          echo "All are scalars, lists, mappings and multiline."
